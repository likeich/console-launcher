name: Sync Platform Data from Daijishou

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create a pull request instead of direct commit'
        required: false
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Daijishou as remote
        run: |
          git remote add upstream https://github.com/magneticchen/Daijishou.git || true
          git fetch upstream main

      - name: Copy platforms directory
        run: |
          # Backup custom files
          cp platforms/.gitignore /tmp/.gitignore.bak 2>/dev/null || true
          cp platforms/README.md /tmp/README.md.bak 2>/dev/null || true
          cp platforms/custom-players.json /tmp/custom-players.json.bak 2>/dev/null || true
          cp platforms/custom-ids.json /tmp/custom-ids.json.bak 2>/dev/null || true

          # Remove existing platforms directory
          rm -rf platforms

          # Checkout platforms directory from upstream
          git checkout upstream/main -- platforms/

          # Remove unwanted files
          cd platforms
          rm -f *.deprecated *.test *.py

          # Update baseUri in index.json to point to our repo
          sed -i 's|https://raw.githubusercontent.com/magneticchen/Daijishou/main/platforms/|https://raw.githubusercontent.com/likeich/console-launcher/main/platforms/|g' index.json

          cd ..

          # Restore custom files
          cp /tmp/.gitignore.bak platforms/.gitignore 2>/dev/null || true
          cp /tmp/README.md.bak platforms/README.md 2>/dev/null || true
          cp /tmp/custom-players.json.bak platforms/custom-players.json 2>/dev/null || true
          cp /tmp/custom-ids.json.bak platforms/custom-ids.json 2>/dev/null || true

      - name: Apply custom players
        run: |
          python3 << 'EOF'
          import json
          import os
          import re

          # Edits are made as text so files keep upstream's formatting and a
          # file without customizations stays byte-identical to upstream.
          P = 'platforms/'
          texts, counts, base_rev = {}, {}, {}

          def load(name):
              if name not in texts:
                  with open(P + name) as f:
                      texts[name] = f.read()
                  counts[name] = 0
                  base_rev[name] = json.loads(texts[name])['revisionNumber']
              return texts[name]

          def players(text):
              """[(player, start, end)] for each object in playerList."""
              pos = text.index('[', text.index('"playerList"')) + 1
              out = []
              while True:
                  while text[pos] in ' \n\t,':
                      pos += 1
                  if text[pos] == ']':
                      return out
                  obj, end = json.JSONDecoder().raw_decode(text, pos)
                  out.append((obj, pos, end))
                  pos = end

          def component(player):
              m = re.search(r'-n (\S+)', player['amStartArguments'])
              return m.group(1) if m else None

          def read_json(name):
              if not os.path.exists(P + name):
                  return []
              with open(P + name) as f:
                  return json.load(f)

          # Rename duplicated uniqueIds. The player is picked by uniqueId, -n
          # component and name; the rename applies only while the id is duplicated.
          for e in read_json('custom-ids.json'):
              if not os.path.exists(P + e['file']):
                  print(f"Warning: {e['file']} not found, skipping.")
                  continue
              text = load(e['file'])
              items = players(text)
              same = [i for i in items if i[0]['uniqueId'] == e['uniqueId']]
              hit = [i for i in same if component(i[0]) == e['component'] and i[0]['name'] == e['name']]
              if len(same) < 2 or len(hit) != 1:
                  print(f"Skipping rename of '{e['uniqueId']}' in {e['file']}.")
                  continue
              _, start, end = hit[0]
              old = f'"uniqueId": {json.dumps(e["uniqueId"])}'
              chunk = text[start:end].replace(old, f'"uniqueId": {json.dumps(e["newUniqueId"])}', 1)
              texts[e['file']] = text[:start] + chunk + text[end:]
              counts[e['file']] += 1
              print(f"Renamed '{e['uniqueId']}' to '{e['newUniqueId']}' in {e['file']}")

          # Inject custom players
          for entry in read_json('custom-players.json'):
              if not os.path.exists(P + entry['file']):
                  print(f"Warning: {entry['file']} not found, skipping.")
                  continue
              text = load(entry['file'])
              player = entry['player']
              items = players(text)
              if any(i[0]['uniqueId'] == player['uniqueId'] for i in items):
                  print(f"'{player['uniqueId']}' already in {entry['file']}, skipping.")
                  continue
              after = next((i for i in items if i[0]['uniqueId'] == entry.get('insertAfter')), None)
              if entry.get('insertAfter') and after is None:
                  print(f"Warning: insertAfter '{entry['insertAfter']}' not found in {entry['file']}, appending.")
              end = (after or items[-1])[2]
              body = json.dumps(player, indent=2, ensure_ascii=False).replace('\n', '\n    ')
              texts[entry['file']] = text[:end] + ',\n    ' + body + text[end:]
              counts[entry['file']] += 1
              print(f"Injected '{player['name']}' into {entry['file']}")

          # revisionNumber = upstream revision + customizations, so clients refetch
          # on every customization and a re-sync lands on the same number.
          with open(P + 'index.json') as f:
              index = f.read()
          for name, text in texts.items():
              rev = base_rev[name] + counts[name]
              if not counts[name]:
                  continue
              text = re.sub(r'("revisionNumber": )\d+', lambda m: m.group(1) + str(rev), text, count=1)
              with open(P + name, 'w') as f:
                  f.write(text)
              pattern = r'("filename": ' + re.escape(json.dumps(name)) + r'[^}]*?"revisionNumber": )\d+'
              index, n = re.subn(pattern, lambda m: m.group(1) + str(rev), index, count=1)
              if n != 1:
                  print(f"Warning: {name} not found in index.json.")
          with open(P + 'index.json', 'w') as f:
              f.write(index)

          EOF

          # Show what changed
          git status

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true' && (github.event_name == 'schedule' || inputs.create_pr)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync platform data from Daijishou'
          title: 'Sync platform data from upstream Daijishou'
          body: |
            Automated sync of platform definitions from [magneticchen/Daijishou](https://github.com/magneticchen/Daijishou).

            **Please review the changes carefully before merging.**

            Changes may include:
            - New platforms
            - Updated emulator cores
            - Changed file extensions
            - Updated scraper configurations
            - Revised RetroAchievements integration

            Check the Files Changed tab to see what was modified.
          branch: sync-platforms
          delete-branch: true
          labels: |
            platforms
            automated

      - name: Direct Commit
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name == 'workflow_dispatch' && !inputs.create_pr
        run: |
          git add platforms/
          git commit -m "chore: sync platform data from Daijishou"
          git push origin main

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Platform data synced successfully"
            if [ "${{ github.event_name == 'schedule' || inputs.create_pr }}" == "true" ]; then
              echo "📝 Pull request created for review"
            else
              echo "💾 Changes committed directly to main"
            fi
          else
            echo "ℹ️ No changes detected - platform data is already up to date"
          fi
